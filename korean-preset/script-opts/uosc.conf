# uosc 설정
#
# 기본값에서 바꿀 것만 적는다. 전체 설정 파일(248줄)을 복사해 두면 uosc 가
# 기본값을 개선해도 우리 사본에 묻혀 반영되지 않는다.


# 한국어 번역.
#
# uosc 의 intl/ 폴더에는 12개 언어가 들어 있는데 한국어가 없다. 그래서
# 직접 만든 파일을 쓴다. uosc 폴더 안(intl/ko.json)에 넣지 않는 이유는,
# 포장할 때마다 uosc 를 새로 받아 덮어쓰기 때문이다 — 우리 파일은 우리
# 폴더에 둬야 버전을 올려도 살아남는다.
#
# 목록은 우선순위가 높은 것부터다. 뒤의 en 이 먼저 읽혀 기준을 비우고,
# 앞의 우리 파일이 그 위에 덮인다. 중간의 ko 는 지금은 없는 파일이라
# 조용히 무시되고, 나중에 uosc 에 한국어가 들어오면 그때 쓰인다
# (없는 파일은 table_assign 이 걸러낸다).
languages=~~/uosc-ko.json,ko,en


# 파일 삭제를 휴지통으로 보낸다.
#
# uosc 메뉴에는 재생 중인 파일을 지우는 항목이 있다. 기본값은 즉시 완전
# 삭제라, 잘못 누르면 되돌릴 수 없다. 윈도우는 휴지통이 기본 기능이라
# 추가로 설치할 것도 없다.
use_trash=yes
