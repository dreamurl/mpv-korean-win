# mpv 한국어판 — 기본 설정
#
# 이 파일은 손대지 않아도 되도록 짰다. 화질만 바꾸고 싶으면 quality.conf 를
# 교체하면 된다(설치 프로그램을 다시 돌려도 되고, 파일만 바꿔도 된다).


##### 화질 프리셋 ####################################################
#
# quality.conf 에는 등급 3종 x 모드 6종의 프로필이 전부 들어 있다. 이 파일은
# 프로필을 '정의'만 하고 아무것도 적용하지 않는다.
#
# 무엇을 적용할지는 scripts/tier.lua 가 quality-state.conf 를 읽어서 정한다.
# 그래야 사용자가 우클릭 메뉴에서 고른 값이 다음 실행에도 남는다.

include=~~/quality.conf


##### 자막 — 한국어 사용자를 위한 핵심 설정 ##########################
#
# 국내 자막은 상당수가 CP949(EUC-KR)로 저장돼 있다. mpv 의 인코딩 판정은
# 아래 순서로 일어난다(mpv 공식 문서 --sub-codepage).
#
#   1. 코드페이지에 + 가 붙어 있으면 → 강제 적용
#   2. 데이터가 UTF-8 처럼 보이면    → UTF-8
#   3. sub-codepage 에 지정된 값     → 그것
#   4. uchardet 자동 감지
#   5. 실패 → UTF-8-BROKEN (글자 깨짐)
#
# 그래서 + 없이 cp949 를 둔다. 요즘 UTF-8 자막은 2번에서 잡히고, 옛 CP949
# 자막은 3번에서 잡혀 uchardet 의 오판(4번)을 아예 거치지 않는다.
#
# +cp949 로 강제하면 UTF-8 자막이 깨진다. + 를 붙이지 말 것.
sub-codepage=cp949

# 자막 파일 자동 탐색. exact(기본)는 파일명이 정확히 같아야 하는데,
# 국내 자막은 "[자막] 제목.smi" 처럼 앞뒤에 뭔가 붙는 경우가 흔하다.
sub-auto=fuzzy

# 자막을 따로 폴더에 모아두는 습관을 감안한다. 영상 파일 기준 상대경로다.
sub-file-paths=자막;Subs;subs;subtitles;Subtitles

# .smi 는 한국에서만 쓰다시피 하는 포맷이라 기본 목록에서 빠질 때가 있다.
# 드래그 앤 드롭으로 자막을 얹을 때도 이 목록이 쓰인다.
sub-auto-exts=srt,ass,ssa,smi,sub,idx,vtt,sup,txt

# 자막 글꼴. 윈도우에 기본 내장된 것만 쓴다 — 폰트를 동봉하면 배포
# 라이선스를 따로 따져야 하고 용량도 늘어난다. ASS/SSA 자막은 자체 지정
# 글꼴을 쓰므로 이 값은 srt·smi 처럼 서식 없는 자막에만 적용된다.
sub-font=Malgun Gothic
sub-font-size=46
sub-border-size=2.6
sub-shadow-offset=0

# 자막을 화면 맨 아래가 아니라 조금 올려 붙인다. 16:9 영상을 전체화면으로
# 볼 때 화면 끝에 딱 붙으면 읽기 불편하다.
sub-margin-y=48


##### 재생 ###########################################################

# 하드웨어 디코딩. mpv 는 안전을 위해 기본이 꺼져 있는데, 요즘 PC 에서는
# 켜는 쪽이 CPU 점유율과 발열에 낫다. 실패하면 알아서 소프트웨어로 내려간다.
hwdec=auto-safe

# 렌더러. gpu-next 는 libplacebo 기반이라 셰이더 처리가 더 빠르고 정확하다.
vo=gpu-next

# 종료한 위치를 기억했다가 다음에 이어서 재생한다.
save-position-on-quit=yes

# 창 크기를 화면의 60% 로. 기본값은 영상 해상도 그대로라 4K 영상을 열면
# 창이 화면 밖으로 넘친다.
autofit=60%x60%

# 같은 폴더의 다음 파일로 자동으로 넘어가지 않는다. 애니 정주행에는
# 편하지만 영화 한 편 보고 끄려는 사람에게는 당황스럽다.
keep-open=yes


##### 화면 표시 ######################################################

# uosc 가 자체 UI 를 그리므로 mpv 기본 컨트롤러와 진행바를 끈다.
osc=no
osd-bar=no

# uosc 가 창 테두리를 직접 그린다.
border=no

# OSD(화면 위 안내 문구) 글꼴도 한글이 나오게.
osd-font=Malgun Gothic


##### 스크린샷 #######################################################

screenshot-format=png
screenshot-png-compression=7
screenshot-directory=~~desktop/
screenshot-template=mpv-%F-%p
