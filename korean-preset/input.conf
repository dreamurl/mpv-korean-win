# 단축키
#
# 줄 끝의 `#!` 주석은 uosc 가 읽어서 **우클릭 메뉴**를 만든다. 일반 사용자는
# 단축키를 외울 필요 없이 화면에 대고 우클릭해서 고르면 된다. `>` 는 하위
# 메뉴 구분이다.
#
# 화질 프로필의 실제 셰이더 목록은 quality.conf 에 있다. 여기서는 이름만
# 부르므로, GPU 등급을 바꿔도 이 파일은 손대지 않아도 된다.


##### 메뉴 열기 ####################################################
#
# 이 줄이 없으면 우클릭해도 메뉴가 뜨지 않는다. 아래 `#!` 주석들이 전부
# 무용지물이 되므로 지우지 말 것.

mbtn_right script-binding uosc/menu
menu       script-binding uosc/menu


##### 화질 #########################################################
#
# 두 가지를 따로 고른다.
#
#   모드(A/B/C) = **영상 종류**. 눈으로 보고 제일 나은 것을 쓴다.
#   성능        = **내 그래픽카드**. 한 번 정하면 계속 간다.
#
# 둘 다 scripts/tier.lua 가 받아서 quality.conf 의 프로필을 적용하고,
# 고른 값을 quality-state.conf 에 적어 둔다. 그래서 **다음에 켤 때도
# 유지된다** — apply-profile 을 직접 부르면 그때뿐이라 이렇게 한다.

# uosc 메뉴 문법: 키 자리에 `#` 를 두면 단축키 없이 메뉴에만 나온다.
# 명령을 생략하고 제목만 두면 누를 수 없는 소제목이 되고, 제목을 `---` 로
# 하면 구분선이 된다.

#      #! 화질 > 영상 종류에 맞추기
CTRL+1 script-binding tier/set-mode-a    #! 화질 > A — 1080p 애니
CTRL+2 script-binding tier/set-mode-b    #! 화질 > B — 720p 애니
CTRL+3 script-binding tier/set-mode-c    #! 화질 > C — 480p·저해상도
CTRL+4 script-binding tier/set-mode-aa   #! 화질 > A+A — 1080p (무거움)
CTRL+5 script-binding tier/set-mode-bb   #! 화질 > B+B — 720p (무거움)
CTRL+6 script-binding tier/set-mode-ca   #! 화질 > C+A — 저해상도 (무거움)

#      #! 화질 > ---

# 버벅일 때 누를 자리. 화질 보정을 끄면 대부분 해결된다.
CTRL+0 script-binding tier/set-mode-off  #! 화질 > 끄기 — 버벅일 때

# 내 PC 성능. 설치할 때 고른 값이 들어 있고, 여기서 언제든 바꿀 수 있다.
# 바꾸면 즉시 화면에 반영되므로 눈으로 보고 정하면 된다.
#      script-binding tier/set-tier-low   #! 화질 > 내 PC 성능 > 내장 그래픽
#      script-binding tier/set-tier-std   #! 화질 > 내 PC 성능 > 보통
#      script-binding tier/set-tier-high  #! 화질 > 내 PC 성능 > 고성능

CTRL+i script-binding tier/show-current   #! 화질 > 지금 설정 확인


##### 자막 #########################################################

# 자막 트랙 고르기 / 파일 불러오기
s      script-binding uosc/subtitles                                     #! 자막 > 자막 고르기
CTRL+f script-binding uosc/load-subtitles                                #! 자막 > 자막 파일 열기
v      cycle sub-visibility                                              #! 자막 > 보이기 / 숨기기

# 한글 자막이 깨질 때. mpv 는 UTF-8 → cp949 순으로 판정하는데, 아주 드물게
# UTF-8 로 오인되는 cp949 파일이 있다. 그때 강제로 바꾼다. 바꾼 뒤 자막을
# 다시 읽어야 화면에 반영되므로 sub-reload 를 같이 부른다.
CTRL+j cycle-values sub-codepage "+cp949" "+utf-8" "cp949" ; sub-reload ; show-text "자막 인코딩: ${sub-codepage}"   #! 자막 > 글자가 깨질 때 (인코딩 바꾸기)

# 싱크가 안 맞을 때 (mpv 기본 z / Z 도 그대로 쓸 수 있다)
CTRL+LEFT  add sub-delay -0.5 ; show-text "자막 ${sub-delay} 초"          #! 자막 > 0.5초 당기기
CTRL+RIGHT add sub-delay +0.5 ; show-text "자막 ${sub-delay} 초"          #! 자막 > 0.5초 미루기
CTRL+BS    set sub-delay 0 ; show-text "자막 싱크 초기화"                  #! 자막 > 싱크 초기화


##### 소리 #########################################################

a script-binding uosc/audio                                              #! 소리 > 음성 트랙 고르기
CTRL+a script-binding uosc/load-audio                                    #! 소리 > 음성 파일 열기


##### 재생 #########################################################

o script-binding uosc/open-file                                          #! 파일 열기
p script-binding uosc/items                                              #! 재생 > 재생 목록
c script-binding uosc/chapters                                           #! 재생 > 챕터

# 다음·이전 파일. 애니 정주행에 쓴다.
> script-binding uosc/next                                               #! 재생 > 다음 파일
< script-binding uosc/prev                                               #! 재생 > 이전 파일

# 배속
] multiply speed 1.25 ; script-binding uosc/flash-speed                  #! 재생 > 빠르게
[ multiply speed 0.8  ; script-binding uosc/flash-speed                  #! 재생 > 느리게
\ set speed 1.0 ; script-binding uosc/flash-speed                        #! 재생 > 배속 초기화


##### 창·설정 #####################################################

f   cycle fullscreen                                                     #! 창 > 전체화면
ESC set fullscreen no

# 설정을 직접 바꾸고 싶을 때. quality.conf 를 다른 등급 파일로 바꾸면
# 화질 등급이 바뀐다 — 프로그램을 다시 설치할 필요 없다.
CTRL+, script-binding uosc/open-config-directory                         #! 설정 > 설정 폴더 열기

q quit-watch-later                                                       #! 종료 (본 위치 기억)
